name: Sync plugin repository index

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - '.github/scripts/Sync-PluginIndex.ps1'

permissions:
  contents: write

concurrency:
  group: plugin-index-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate plugin index
        shell: pwsh
        run: |
          & ./.github/scripts/Sync-PluginIndex.ps1
      - name: Commit updated index
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output 'Index already up to date.'; exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Cannot inspect index changes.' }
          git commit -m 'Sync plugin repository index'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Push failed.' }
