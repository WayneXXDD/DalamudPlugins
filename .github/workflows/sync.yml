name: Sync plugin repository index

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: plugin-index-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate plugin index
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'https://raw.githubusercontent.com/WayneXXDD/Combo/plugin-repo/build-manifest.json'
          $text = (Invoke-WebRequest -Uri $source).Content
          $entries = @($text | ConvertFrom-Json)
          if ($entries.Count -ne 2 -or ((@($entries.InternalName | Sort-Object) -join ',') -ne 'Oracle,XIVComboExpandedest')) {
            throw 'Expected Combo and Oracle in the source index.'
          }
          foreach ($entry in $entries) {
            if ([version]$entry.AssemblyVersion -le [version]'0.0.0.0' -or [int]$entry.DalamudApiLevel -le 0) {
              throw 'Invalid plugin version or API level.'
            }
            $expected = "https://raw.githubusercontent.com/WayneXXDD/Combo/plugin-repo/plugins/$($entry.InternalName)/latest.zip"
            if ($entry.DownloadLinkInstall -ne $expected -or $entry.DownloadLinkUpdate -ne $expected) {
              throw 'Unexpected plugin download URL.'
            }
          }
          if (Test-Path -LiteralPath pluginmaster.json) {
            $previous = @(Get-Content -LiteralPath pluginmaster.json -Raw | ConvertFrom-Json)
            foreach ($entry in $entries) {
              $old = $previous | Where-Object InternalName -eq $entry.InternalName | Select-Object -First 1
              if ($old -and [version]$entry.AssemblyVersion -lt [version]$old.AssemblyVersion) {
                throw 'Refusing to replace a newer plugin version.'
              }
            }
          }
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'pluginmaster.json'), $text, [Text.UTF8Encoding]::new($false))
      - name: Commit updated index
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output 'Index already up to date.'; exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Cannot inspect index changes.' }
          git commit -m 'Sync Combo and Oracle plugin index'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Push failed.' }
